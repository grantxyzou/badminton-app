name: Bug report
description: Something broke or looks wrong in the app.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more you can tell us, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do? What did you see?
      placeholder: I tapped the sign-up button and nothing happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected to be added to the session.
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: URL
      description: The page you were on when it broke, if you know it.
      placeholder: https://bpm.grantzou.com/bpm/...
    validations:
      required: false
  - type: input
    id: sha
    attributes:
      label: Build SHA
      description: Which build broke, if you know it. Leave blank if you don't.
      placeholder: abcd123
    validations:
      required: false
  - type: input
    id: ua
    attributes:
      label: Device / browser
      description: The phone and browser you were using.
      placeholder: iPhone 17 Pro Max, Safari 18.x
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste or drag images here if you have any.
    validations:
      required: false
