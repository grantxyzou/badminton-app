name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Bot-authored PRs are SKIPPED, not reviewed.
    #
    # The action refuses a non-human actor outright — "Workflow initiated by
    # non-human actor: dependabot (type: Bot)" — and exits 1. That painted a
    # permanent red X on every dependency PR (#310, #322, #323, #324 all carry
    # one today), and a check that is always red for a whole PR class is worse
    # than no check: it teaches you to skim past red exactly where a real
    # failure would show up. #324's genuine `verify` failure sat next to a
    # meaningless red `claude-review` for a day.
    #
    # Allowing bots through was the other option and is the wrong one: a
    # REVIEW.md review of a 269-line package-lock.json diff has nothing to say,
    # and it would spend tokens per dependency PR to say it. What matters on
    # those is `verify`, which does run.
    #
    # NOTE: this cannot be proven on the PR that introduces it — the action
    # skips any PR touching its own workflow file (see CLAUDE.md). Proof is the
    # next Dependabot PR showing a grey skip instead of a red X.
    if: github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access so the review bot can post PR review comments.
      # Previously `read` which silently swallowed review output.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # REVIEW.md is the review policy: what to check, how to rank it, what
          # not to flag. Without it the reviewer knows nothing about strip
          # canaries, lying empty states or the additive-schema rule.
          #
          # `--comment` is NOT optional. Without it the plugin writes its review
          # to the runner's terminal and exits 0 — which this job did on every
          # PR from #285 to #301, including a canary with two planted defects,
          # while showing a green check. The allowlist is the other half: the
          # SDK denies `gh pr comment` unless it is named here (the #301 run
          # logged `permission_denials_count: 4`).
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Before reporting, read REVIEW.md at the repository root and apply it: rank findings the way it ranks them, and do not report anything it lists under "Do not flag".
          # Read/Grep/Glob are what make this a REVIEW rather than a diff
          # reader. Without them the agent can see only the lines the PR
          # changed and cannot open the file they land in — which is this
          # repo's own recorded blind spot ("a per-task review scoped to its
          # own diff cannot see cross-file breakage", CLAUDE.md), wired into
          # the gate meant to catch it.
          #
          # It was also being told to do something it had been denied: the
          # prompt above says "read REVIEW.md at the repository root", and
          # `Read` was not on this list. The review POLICY was unreadable by
          # the reviewer. #331 logged `permission_denials_count: 12` across
          # 3 turns and reported nothing — a green check that cannot be
          # distinguished from "looked and found nothing".
          #
          # All three are read-only. They add no ability to change the repo,
          # post, or run anything, and no new exposure to a hostile PR: the
          # agent already ingests PR-authored text through `gh pr diff`, and
          # THE ACTION ITSELF — not any step in this file — restores .claude/,
          # .mcp.json, CLAUDE.md and friends from the base branch before Claude
          # starts. The run log says it in as many words: "Restoring .claude,
          # ..., CLAUDE.md, .husky from origin/main (PR head is untrusted)".
          # That restore is load-bearing here, because this repo TRACKS
          # .claude/settings.json with a SessionStart hook and two PreToolUse
          # Bash hooks that run `node scripts/*.mjs`; the checkout is the merge
          # ref, so without the restore a PR head could register its own. It is
          # the action's guarantee (see its security.md), not ours.
          #
          # `mcp__github_inline_comment__create_inline_comment` IS THE POSTING
          # MECHANISM, and it is documented. The action starts the inline-comment
          # MCP server ONLY when --allowedTools names that tool. It had never
          # been named here, and every run printed "No buffered inline comments"
          # — 35 of 35. The single run that ever posted (#342) improvised
          # `gh api .../pulls/342/comments` by hand, which Bash(gh api:*)
          # happens to permit. That was a workaround, not the mechanism, which
          # is why posting has been intermittent rather than simply broken.
          #
          # `Skill` and `Agent` were added 2026-09-10 and REVERTED the same day.
          # Neither is a documented allowedTools value for this action, and
          # allowing them changed nothing measurable: runs 34489909359 and
          # 34490515068 on PR #355 logged 10 and 18 denials WITH both allowed —
          # at or above the median — and posted nothing. #342 posted four
          # correct findings with `Agent` denied 11 times and `Skill` never
          # attempted. The fan-out was never what stood in the way.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          #
          # The canary that produced the reverted theory was #356, and it is the
          # cautionary tale: it planted five REVIEW.md-named defects but titled
          # itself "DO NOT MERGE — planted-defect canary" and listed them in the
          # body, so the plugin's own eligibility step was entitled to skip it.
          # Zero comments there measured nothing. Plant ONE defect in a genuine
          # PR instead.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Say what the run actually did — above all, which tools it was refused.
      #
      # This job has now been silently not-working in FOUR distinct ways, each
      # showing a green check, and every diagnosis has been a guess confirmed by
      # trial: the run log prints a denial COUNT and never the tool names, and
      # the action uploads no transcript. The 2026-09-09 planted-defect canary
      # (three blocks-merge defects) drew zero comments on every surface with
      # `permission_denials_count: 2`, and there was no way to learn what those
      # two were.
      #
      # `if: always()` because the interesting case is the one where the step
      # above failed. `continue-on-error` because a diagnostic must never turn a
      # quiet review into a red build — a check that fails for its own reasons
      # is how people learn to skim past red.
      - name: What the review run was allowed to do
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # How many files carry a TEXT diff. #379 was 68 binary PNGs and one
          # script, and a quiet review there is correct rather than a sixth
          # silent breakage -- but nothing on the PR could say so.
          #
          # Left UNSET when the lookup fails. The script reads absent as unknown
          # and never as zero: a failed API call must not let the summary
          # announce "nothing to review" over a diff it simply could not count.
          if n=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                   --jq '.[] | select(.patch != null) | .filename' 2>/dev/null | wc -l); then
            export REVIEWABLE_FILE_COUNT="$(echo "$n" | tr -d ' ')"
          fi
          node scripts/summarize-review-run.mjs \
            "${{ steps.claude-review.outputs.execution_file }}" \
            .github/workflows/claude-code-review.yml

