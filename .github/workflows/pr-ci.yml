name: PR CI (strict lockfile + tests + build)

# Shift-left gate. deploy-next.yml runs `npm ci` + `npm test` + build
# only AFTER a push lands on main — so a Dependabot squash that desyncs
# package-lock.json (Dependabot's resolver != the runner's npm; squash
# does not re-resolve) breaks main *post-merge*, before tests even run.
# This job runs the SAME strict steps on the PR, so the failure surfaces
# where it is cheap (a red PR) instead of on the deploy branch.
#
# Mirrors deploy-next.yml exactly: Node 22, same pinned action SHAs,
# `npm ci` (strict), `npm test`, `npm run build` with the same public
# env. Uses NO secrets, so it also runs on Dependabot/bot PRs (unlike
# claude-code-review.yml, which needs a token and is skipped for bots).

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      # The exact strict install deploy-next uses. If package-lock.json
      # is out of sync with package.json (the Dependabot-squash trap),
      # this fails HERE — on the PR — with the same EUSAGE error,
      # instead of red-ing main after merge.
      - name: Install dependencies (strict, mirrors deploy)
        run: npm ci

      # ESLint (flat config, eslint.config.mjs). Fails the PR on lint *errors*
      # only — `eslint .` exits 0 on warnings, so the deferred React-Compiler /
      # exhaustive-deps / a11y warning pile (audit "Harvest B") doesn't block.
      - name: Lint
        run: npm run lint

      # `next build` does NOT run a full typecheck, so a type error in a module
      # the build never reaches — or in any test file — passes both `build` and
      # `test` and only surfaces on a cold `tsc`. The incremental
      # `tsconfig.tsbuildinfo` cache hid exactly that for 7 errors until #220.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Build too, so a dependency bump that compiles-but-breaks-build
      # is caught pre-merge. Same public env as deploy-next (no secrets;
      # the Azure publish profile is only needed by the deploy step,
      # which this gate intentionally stops short of).
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /bpm
          # Build-time input to next.config.js rewrites(); see deploy-next.yml.
          APP_ORIGIN: https://bpm.grantzou.com
          NEXT_PUBLIC_BASE_URL: https://vnext-badminton-app-enhcave5djcvafe9.canadacentral-01.azurewebsites.net/bpm
          NEXT_PUBLIC_MAX_PLAYERS: '12'
          NEXT_PUBLIC_ETRANSFER_EMAIL: grantxyzou@gmail.com
          NEXT_PUBLIC_ENV: next
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_FLAG_DESIGN_PREVIEW: 'true'
          NEXT_PUBLIC_FLAG_VALUE_HUB_SLICE: 'true'
          # Mirrors deploy-next.yml. CI must BUILD what production builds:
          # 13 flags and the VAPID key were missing here on 2026-08-28, so every
          # PR was compiled as a materially different app than the one that
          # ships. scripts/check-flag-sync.mjs now checks BOTH workflows.
          NEXT_PUBLIC_FLAG_AUTH_PROVIDERS: 'true'
          NEXT_PUBLIC_FLAG_GEAR_RECOMMENDER: 'true'
          NEXT_PUBLIC_FLAG_KUDOS: 'true'
          NEXT_PUBLIC_FLAG_PUSH_NOTIFY: 'true'
          NEXT_PUBLIC_FLAG_NATIVE_MIGRATE: 'false'
          NEXT_PUBLIC_FLAG_STRINGING: 'true'
          NEXT_PUBLIC_FLAG_VISUAL_FIELDS: 'true'
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      # Boot the STANDALONE bundle and check it answers — pre-merge, so the
      # render and packaging failures below never reach a phone.
      #
      # Standalone specifically, not `next start`: `output: 'standalone'` drops
      # .next/static and public/, and deploy-next.yml copies both in by hand.
      # That copy has broken before and nothing could see it until users could.
      # Running the same two lines here means the bundle this gate approves is
      # shaped like the one that ships.
      #
      # No Cosmos in CI, so the app runs on the in-memory mock store: --mock
      # relaxes the `_rid` assertion (which exists to catch a mock store in
      # PRODUCTION) while still requiring the endpoint to answer. --skip-well-known
      # because those files come from App Settings, not the bundle.
      - name: Smoke the standalone bundle (read-only)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3100 node .next/standalone/server.js &
          echo $! > "$RUNNER_TEMP/next.pid"
          node scripts/smoke-prod.mjs --base http://localhost:3100/bpm --skip-well-known --mock
          kill "$(cat "$RUNNER_TEMP/next.pid")" 2>/dev/null || true
        env:
          NEXT_PUBLIC_BASE_PATH: /bpm
