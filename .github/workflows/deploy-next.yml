name: Deploy to bpm-next (auto, on push to main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mirrors the PR gate, so a type error can't reach a deploy either.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /bpm
          # Canonical URL for SEO + social-share metadata. The custom domain is
          # wired up and is how everyone reaches the app, so this is it — the
          # azurewebsites.net host made every shared link preview the wrong
          # domain. basePath, env and flags are unaffected.
          NEXT_PUBLIC_BASE_URL: https://bpm.grantzou.com/bpm
          NEXT_PUBLIC_MAX_PLAYERS: '12'
          NEXT_PUBLIC_ETRANSFER_EMAIL: grantxyzou@gmail.com
          # Yes, "stable" in the workflow named bpm-next. This deployment IS
          # production now — everyone reaches it via bpm.grantzou.com and nobody
          # uses bpm-stable. Building it as `next` made it advertise itself as a
          # preview to the people relying on it: PreviewBanner rendered ("not the
          # stable site", plus a personal email), and the releases filter in
          # app/api/releases/route.ts served 12 entries with duplicates instead
          # of 8. This one value drives both. Revert to `next` to undo.
          NEXT_PUBLIC_ENV: stable
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_FLAG_DESIGN_PREVIEW: 'true'
          NEXT_PUBLIC_FLAG_VALUE_HUB_SLICE: 'true'
          NEXT_PUBLIC_FLAG_VISUAL_FIELDS: 'true'
          NEXT_PUBLIC_FLAG_KUDOS: 'true'
          NEXT_PUBLIC_FLAG_GEAR_RECOMMENDER: 'true'
          # NEXT_PUBLIC_* is baked at build time, so this must live here -- an
          # Azure App Setting cannot turn it on.
          #
          # OFF since 2026-08-26, after Google sign-in was found broken on an
          # installed iOS home-screen app: the callback is issued from a browser
          # container that never saw the bpm_oauth_state cookie /start wrote
          # inside the PWA, so every attempt dies as state_mismatch and strands
          # the user in Safari. Reproduced on device three times. The server
          # side is NOT at fault -- replaying the handshake with curl sets the
          # cookie, matches the state and passes the check.
          #
          # Landing the redirect inside the manifest scope (f5e0c65) was tried
          # and did not fix it, which rules out the callback simply being
          # bounced for an out-of-scope target.
          #
          # Turning this off leaves PIN and email+password untouched; both work
          # everywhere, including in the PWA, because neither leaves the origin.
          # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET stay set in the App Service
          # -- they are inert while this is off, and re-flipping is one line.
          #
          # TEMPORARILY ON to run that diagnostic (2026-08-27). The callback
          # 404s behind this flag, so the handshake cannot be measured with it
          # off. `classifyState` + `describeCallbackContext` now emit one
          # `[oauth-diag]` line per failed callback; read it with
          # `az webapp log tail`, during a tap on the installed iOS PWA.
          #
          # TURN THIS BACK TO 'false' THE MOMENT THE LINE IS CAPTURED. Google
          # sign-in is still broken in the PWA; this exposes a button that
          # fails for exactly the users being diagnosed.
          NEXT_PUBLIC_FLAG_AUTH_PROVIDERS: 'true'
          # ON as of 2026-08-27. This lights up the admin bench (job list, job
          # detail, intake form) and un-404s /api/stringing/*.
          #
          # It does NOT show players anything yet: the shop carries its own
          # admin-controlled `open` flag (PATCH /api/stringing/shop), and
          # StringingCard renders "Coming soon" until that is set. Two gates,
          # and this is only the first.
          #
          # KNOWN GAP once the shop DOES open: lib/stringingNotify.ts still has
          # zero callers, so nobody is told their racket is ready. Taking a real
          # racket before that is wired means remembering to tell them yourself.
          NEXT_PUBLIC_FLAG_STRINGING: 'true'
          # ON as of 2026-08-28. Revived from PR #241; the VAPID pair now
          # exists (public key in the repo variable below, private key +
          # VAPID_SUBJECT in vnext App Settings), which is the precondition --
          # the client reads the public key at BUILD time and subscribe()
          # throws when it is undefined.
          #
          # Nobody is notified until they OPT IN on Profile -> Notifications,
          # and only one trigger is wired: sign-ups opening.
          NEXT_PUBLIC_FLAG_PUSH_NOTIFY: 'true'
          # NOT a secret: the browser needs it for
          # pushManager.subscribe({ applicationServerKey }). It must live HERE
          # and not only in Azure App Settings, because NEXT_PUBLIC_* is inlined
          # at build time. The PRIVATE key and VAPID_SUBJECT are runtime-only
          # and belong in App Settings.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - name: Package standalone build
        run: |
          # Next.js standalone output excludes .next/static and public/ —
          # both must be copied in manually before zipping.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cd .next/standalone
          zip -r ../../standalone-deploy.zip .

      - name: Deploy to Azure Web App
        # v3.0.8. Re-pinned 2026-08-27: the previous SHA was an older v3 commit
        # declaring `using: node20`, so every deploy carried a Node 20
        # deprecation annotation and was being force-run on Node 24 anyway.
        # This commit declares node24. Keep the SHA pin — the floating `@v3`
        # tag moves, which is the whole reason the other two are pinned.
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'vnext-badminton-app'
          slot-name: 'Production'
          package: standalone-deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C63C5B445B514543BFF5CFA2959ABBD0 }}
