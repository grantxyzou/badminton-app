schema_version: "1.1"
name: fact-check-duo-pane-widths
expected_outcome: |
  The response boots the mock app, measures Home at the Duo-landscape size
  (951 x 620) with the bundled fold-shots script or an equivalent Playwright
  run, and reports in numbers: the two panes are EQUAL (about 356 px each),
  the week sits in the right pane and the account/nudges in the left, and the
  date tile wraps to two lines there. It says the claim of unequal widths is
  wrong, explains why both panes are narrow (the side tab bar's width is
  mirrored on the left so the gap stays on the hinge), and says that is a
  recorded decision rather than proposing to move the gap off centre. It uses
  the skill's report shape (Measured / Rules / Seen / Verdict).
